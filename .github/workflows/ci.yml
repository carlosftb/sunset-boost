name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build SunsetBoost.sln -c Release -nologo

      - name: Testar
        run: dotnet test SunsetBoost.sln -c Release --no-build -nologo
