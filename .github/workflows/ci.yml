name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions presas pelo SHA do commit (o comentário diz a versão): uma tag pode ser movida, um SHA não.
jobs:
  build:
    name: Compilar e testar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build SunsetBoost.sln -c Release -nologo

      - name: Testar
        run: dotnet test SunsetBoost.sln -c Release --no-build -nologo --filter "Requires!=Desktop"   # testes com janelas de verdade rodam só no PC

  pix:
    name: Conferir chave Pix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar leitor de QR
        run: pip install --disable-pip-version-check zxing-cpp==3.1.1 pillow==13.0.0

      - name: QR, copia e cola e chave do README levam pra chave oficial
        run: python .github/scripts/verificar-pix.py
